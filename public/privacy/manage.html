<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Участие в программе лояльности</title><style>body{max-width:650px;margin:40px auto;padding:20px;font:17px/1.5 system-ui;background:#101216;color:#f4f4f0}a{color:#b0d8ff}button,input{box-sizing:border-box;font:inherit;padding:12px;border-radius:20px;min-height:48px}button{cursor:pointer}input{width:100%}label{display:block}section{margin:24px 0}#withdraw{background:#f0c3c3}p{color:#bfc4cc}</style><a href="/">К заказу</a><h1>Участие в программе лояльности</h1><p>Здесь можно проверить статус или отозвать согласие. Обычные заказы останутся доступны. Для защиты ваших данных подтвердите свой телефон через Telegram.</p><label for="phone">Телефон Беларуси</label><input id="phone" type="tel" autocomplete="tel" placeholder="+375291234567"><section><button id="start">Подтвердить телефон</button><a id="telegram" hidden target="_blank" rel="noopener">Перейти в Telegram</a></section><p id="status" role="status" aria-live="polite"></p><button id="check" hidden>Телефон подтверждён — проверить</button><button id="withdraw" hidden>Прекратить участие и отозвать согласие</button><p><a href="/legal/privacy">Политика</a> · <a href="/legal/consent">Условия согласия</a></p><script src="/privacy/manage.js"></script></html>
