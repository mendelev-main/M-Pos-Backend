name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Flyway PostgreSQL integration
        run: bash scripts/test-flyway.sh
      - name: One-time VDS setup integration
        run: sudo -E bash scripts/test-vds-setup.sh
