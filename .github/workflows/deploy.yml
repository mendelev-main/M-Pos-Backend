name: Deploy to VDS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before deployment
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://project-dubrovno.store

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VDS_PORT" -H "$VDS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify installed migration-aware deployment entrypoint
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -euo pipefail
          EXPECTED_SCRIPT_SHA="$(sha256sum scripts/deploy-backend.sh | awk '{print $1}')"
          ACTUAL_SCRIPT_SHA="$(ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VDS_PORT" \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" \
            'test "$(stat -c "%u:%a" /opt/mpos/scripts/deploy-backend.sh)" = "0:755" && sha256sum /opt/mpos/scripts/deploy-backend.sh' | awk '{print $1}')"
          test "$ACTUAL_SCRIPT_SHA" = "$EXPECTED_SCRIPT_SHA" || {
            echo 'Install the reviewed root-owned migration-aware deployment script before releasing.' >&2
            exit 1
          }

      - name: Deploy backend
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VDS_PORT" \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" \
            "sudo -n /opt/mpos/scripts/deploy-backend.sh '$EXPECTED_SHA'"

      - name: Verify deployed commit
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_SHA="$(ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VDS_PORT" \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" \
            'git -C /opt/mpos/app rev-parse HEAD')"

          echo "Expected commit: $EXPECTED_SHA"
          echo "Deployed commit: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Commit verification: OK"

      - name: Verify production health
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error https://project-dubrovno.store/health; then
              echo
              echo "Production health: OK"
              exit 0
            fi
            echo "Health check attempt $attempt/10 failed"
            sleep 2
          done

          echo "Production health check failed"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Production deployment successful"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Environment: production"
            echo "- VDS deploy: OK"
            echo "- Commit verification: OK"
            echo "- Production health: OK"
            echo "- URL: https://project-dubrovno.store"
          } >> "$GITHUB_STEP_SUMMARY"
